<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B3B"/>
      <stop offset="100%" stop-color="#B00020"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- Outer angular badge shape -->
  <polygon points="200,10 370,95 370,260 200,390 30,260 30,95"
           fill="url(#darkGrad)" stroke="url(#redGrad)" stroke-width="6"/>

  <!-- Inner angular frame -->
  <polygon points="200,40 345,110 345,248 200,358 55,248 55,110"
           fill="none" stroke="#FF3B3B" stroke-width="2" opacity="0.5"/>

  <!-- Sharp diagonal accent slashes (tactical motif) -->
  <polygon points="60,110 110,110 90,200 40,200" fill="url(#redGrad)"/>
  <polygon points="340,110 290,110 310,200 360,200" fill="url(#redGrad)"/>

  <!-- Central angular monogram "V" (bold, blade-like) -->
  <polygon points="140,120 190,120 200,260 210,120 260,120 220,300 180,300"
           fill="#FFFFFF"/>

  <!-- Bottom crossbar / crosshair accent -->
  <rect x="170" y="320" width="60" height="10" fill="url(#redGrad)"/>
  <rect x="195" y="300" width="10" height="50" fill="url(#redGrad)"/>
</svg>
